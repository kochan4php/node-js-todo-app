name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              # pnpm version is read from the `packageManager` field (pinned).
              with:
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Cache binary MongoDB (mongodb-memory-server)
              uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-v1

            - run: pnpm install --frozen-lockfile

            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build

            - name: Check dependency vulnerabilities (production)
              run: pnpm audit --prod